; GCB 檢測修復工具設定檔
; 操作人員在每台 VM 上都需要自行填寫，詳見 docs/操作手冊.md 的「config.ini」章節
[general]

; 【必填】登入測試用的一般帳號（需有 sudo 權限、可 SSH 登入、不可為 root）
; 程式會暫時放入一把 SSH 金鑰測試登入，測完立即移除
; 例：test_user = gcbtest
test_user =

; 【建議填】這台機器必須持續運作的業務服務（逗號分隔），修復後若停止會自動回滾
; 沒有業務服務就留空
; 例：critical_services = nginx,postgresql
critical_services =

; 【選填】不讓程式處理的規則（逗號分隔 TWGCB-ID）
; 例：exclude_rules = TWGCB-01-012-0108
exclude_rules =

; 【選填】DNS 測試用主機名稱；留空只檢查是否設定 DNS 伺服器
; 例：dns_test_name = www.google.com
dns_test_name =

; 【選填】防火牆種類：auto（自動判斷）/ firewalld / nftables / iptables / ufw
; 系統同時裝了多套防火牆、自動判斷不準確時才需要指定
firewall_backend = auto

; ---------- 以下不需要修改 ----------

; 修復完成後是否暫停，請操作人員另開視窗手動登入確認
manual_login_confirm = yes

; 後測關鍵項目退步時是否自動回滾
auto_rollback = yes

; 報告與備份輸出目錄（相對於程式目錄）
report_dir = reports

; 套件安裝/移除逾時（秒），網路很慢時可調高
package_timeout = 300
